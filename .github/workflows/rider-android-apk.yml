name: Rider Android APK

# Builds an installable test APK of rider-app/ on GitHub's runners (no Expo account needed), then launches it on an emulator.
# Run it by hand: Actions, Rider Android APK, Run workflow. It also runs when rider-app/ changes on main.
# Result: the run page, Artifacts section, chowbuy-rider-apk. Signed with the Android debug key (testing only).

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['rider-app/**', '.github/workflows/rider-android-apk.yml', '.github/scripts/android-smoke.sh']

concurrency:
  group: rider-android-apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        working-directory: rider-app
    env:
      CI: '1'
    steps:
      - name: Free disk space
        working-directory: /
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android/sdk/ndk /opt/ghc /usr/local/share/boost /opt/hostedtoolcache/CodeQL /usr/local/.ghcup
          df -h /
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
          cache: npm
          cache-dependency-path: rider-app/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm ci --legacy-peer-deps
      - run: npx tsc --noEmit
      - run: npm test
      - name: Generate the Android project
        run: npx expo prebuild --platform android --no-install
      - name: Install Android SDK components
        run: |
          SM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | sudo env "JAVA_HOME=$JAVA_HOME" "PATH=$PATH" "$SM" --licenses >/dev/null 2>&1 || true
          sudo env "JAVA_HOME=$JAVA_HOME" "PATH=$PATH" "$SM" "platforms;android-34" "build-tools;34.0.0" "ndk;26.1.10909125"
          sudo chmod -R a+rwX "$ANDROID_HOME" || true
      - name: Build release APK
        working-directory: rider-app/android
        run: |
          sed -i 's/^org.gradle.jvmargs=.*/org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g/' gradle.properties
          chmod +x gradlew
          set +e
          ./gradlew assembleRelease --no-daemon --stacktrace -PreactNativeArchitectures=arm64-v8a,x86_64 2>&1 | tee ../gradle.log
          code=${PIPESTATUS[0]}
          if [ "$code" -ne 0 ]; then
            grep -n -A14 "What went wrong" ../gradle.log | head -40 | while IFS= read -r line; do echo "::error::${line:0:600}"; done
            echo "::error::gradle tail: $(tail -n 25 ../gradle.log | tr '\n' '|' | cut -c1-3500)"
          fi
          exit $code
      - name: Name the APK
        run: |
          mkdir -p ../dist
          cp android/app/build/outputs/apk/release/app-release.apk ../dist/chowbuy-rider.apk
      - uses: actions/upload-artifact@v4
        with:
          name: chowbuy-rider-apk
          path: dist/chowbuy-rider.apk
          if-no-files-found: error
          retention-days: 30

  # Launches the APK on an Android emulator, opens Apply now and fails if the app crashes or the screens do not appear.
  smoke:
    needs: apk
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: chowbuy-rider-apk
          path: apk
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: PKG=ng.chowbuy.rider EXPECT_FIRST='Apply now' TAPS='Apply now' EXPECT_AFTER=Next bash .github/scripts/android-smoke.sh apk/chowbuy-rider.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-rider
          path: smoke-out
          if-no-files-found: ignore
          retention-days: 7
