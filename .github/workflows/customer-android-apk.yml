name: Customer Android APK

# Builds an installable test APK of customer-app/ on GitHub's runners (no Expo account needed).
# Run it by hand: Actions, Customer Android APK, Run workflow. It also runs when customer-app/ changes on main.
# Result: the run page, Artifacts section, chowbuy-customer-<mode>-apk.
#   demo = built-in sample data, works offline from any backend.
#   live = talks to the ChowBuy Supabase project (real accounts, orders, wallet).
# The APK is signed with the standard Android debug key: fine for installing and testing, not for Google Play.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['customer-app/**', '.github/workflows/customer-android-apk.yml']

concurrency:
  group: customer-android-apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        mode: [demo, live]
    defaults:
      run:
        working-directory: customer-app
    env:
      CI: '1'
      EXPO_PUBLIC_DEMO: ${{ matrix.mode == 'demo' && '1' || '0' }}
      # Publishable values only (safe in an app). Empty in the demo build.
      EXPO_PUBLIC_SUPABASE_URL: ${{ matrix.mode == 'live' && 'https://nhaxcyfkbrbwlqbpizjo.supabase.co' || '' }}
      EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ matrix.mode == 'live' && 'sb_publishable_fEoqE8u49jwFe1v36CacDg_seaMgyUS' || '' }}
      EXPO_PUBLIC_PAY_URL: https://pay.chowbuy.ng
      # Optional repository secrets (Settings, Secrets and variables, Actions). Unset is fine.
      GOOGLE_MAPS_ANDROID_KEY: ${{ secrets.GOOGLE_MAPS_ANDROID_KEY }}
    steps:
      - name: Free disk space
        working-directory: /
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android/sdk/ndk /opt/ghc /usr/local/share/boost /opt/hostedtoolcache/CodeQL /usr/local/.ghcup
          df -h /
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
          cache: npm
          cache-dependency-path: customer-app/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Optional Firebase config (Android push)
        env:
          GSJ: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GSJ" ]; then printf '%s' "$GSJ" > google-services.json; echo "google-services.json written"; else echo "No GOOGLE_SERVICES_JSON secret: building without FCM push"; fi

      - run: npm ci --legacy-peer-deps
      - run: npx tsc --noEmit
      - run: npm test

      - name: Generate the Android project
        run: npx expo prebuild --platform android --no-install

      - name: Install Android SDK components
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          SM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          # The SDK folder is root-owned on the runner, so install with sudo and keep Java on the path.
          yes | sudo env "JAVA_HOME=$JAVA_HOME" "PATH=$PATH" "$SM" --licenses >/dev/null 2>&1 || true
          sudo env "JAVA_HOME=$JAVA_HOME" "PATH=$PATH" "$SM" "platforms;android-34" "build-tools;34.0.0" "ndk;26.1.10909125"
          sudo chmod -R a+rwX "$ANDROID_HOME" || true
          ls "$ANDROID_HOME/ndk"

      - name: Build release APK
        working-directory: customer-app/android
        run: |
          sed -i 's/^org.gradle.jvmargs=.*/org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g/' gradle.properties
          chmod +x gradlew
          set +e
          ./gradlew assembleRelease --no-daemon --stacktrace -PreactNativeArchitectures=arm64-v8a,x86_64 2>&1 | tee ../gradle.log
          code=${PIPESTATUS[0]}
          if [ "$code" -ne 0 ]; then
            # Surface the actual error as annotations (visible on the run page without downloading logs).
            grep -n -A14 "What went wrong" ../gradle.log | head -40 | while IFS= read -r line; do echo "::error::${line:0:600}"; done
            grep -nE "Manifest merger|is also present|Suggestion|tools:replace|Attribute " ../gradle.log | head -15 | while IFS= read -r line; do echo "::error::${line:0:600}"; done
            echo "::error::gradle tail: $(tail -n 25 ../gradle.log | tr '\n' '|' | cut -c1-3500)"
          fi
          exit $code

      - name: Name the APK
        run: |
          mkdir -p ../dist
          cp android/app/build/outputs/apk/release/app-release.apk "../dist/chowbuy-customer-${{ matrix.mode }}.apk"
          ls -la ../dist

      - uses: actions/upload-artifact@v4
        with:
          name: chowbuy-customer-${{ matrix.mode }}-apk
          path: dist/chowbuy-customer-${{ matrix.mode }}.apk
          if-no-files-found: error
          retention-days: 30

  # Launches each built APK on an Android emulator (x86_64) and fails if the app crashes within 35 seconds.
  smoke:
    needs: apk
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        mode: [demo, live]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: chowbuy-customer-${{ matrix.mode }}-apk
          path: apk
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: bash .github/scripts/android-smoke.sh apk/chowbuy-customer-${{ matrix.mode }}.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-${{ matrix.mode }}
          path: smoke-out
          if-no-files-found: ignore
          retention-days: 7
