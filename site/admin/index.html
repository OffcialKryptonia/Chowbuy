<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin sign in · ChowBuy</title>
<meta name="robots" content="noindex,nofollow,noarchive">
<meta name="description" content="Sign in to the ChowBuy admin console.">
<link rel="icon" href="../assets/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=Sora:wght@600;700;800&display=swap" rel="stylesheet">
<script>(function(){try{var t=localStorage.getItem('cb-theme');if(!t)t='light';document.documentElement.setAttribute('data-theme',t)}catch(e){}})()</script>
<link rel="stylesheet" href="admin.css?v=20261042">
<style>
.gate{min-height:100vh;min-height:100dvh;display:grid;place-items:center;padding:1.25rem 16px}
.gate .box{width:100%;max-width:25rem;background:var(--card);border:1px solid var(--line);border-radius:1.25rem;box-shadow:var(--shadow);padding:1.75rem 1.5rem}
.gate .logo{display:flex;align-items:center;gap:.6rem;font:800 1.2rem var(--display);margin-bottom:1.25rem}
.gate .logo img{width:2.4rem;height:2.4rem;border-radius:.6rem}
.gate h1{font-size:1.4rem;margin-bottom:.35rem}
.gate .sub{color:var(--muted);font-size:.9rem;margin-bottom:1.25rem}
.gate form{display:grid;gap:.9rem}
.gate .f{display:grid;gap:.35rem}
.gate label{font-weight:700;font-size:.84rem}
.gate input{width:100%;padding:.75rem .9rem;border:1px solid var(--line);border-radius:.75rem;background:var(--bg);font-size:1rem}
.gate .btn{width:100%;justify-content:center;padding:.8rem 1rem;font-size:1rem}
.gate .err{color:var(--red);font-size:.88rem;min-height:1.2rem}
.gate .foot{margin-top:1.1rem;font-size:.78rem;color:var(--muted);text-align:center}
.gate .busy{display:grid;place-items:center;gap:.8rem;padding:2rem 0;color:var(--muted)}
#root[hidden],.gate[hidden]{display:none}
</style>
</head>
<body>
<div class="gate" id="gate">
  <div class="box">
    <div class="logo"><img src="../assets/logo.png" alt="" width="38" height="38"><span>ChowBuy</span></div>
    <div id="busy" class="busy" role="status"><span>Checking your session…</span></div>
    <div id="signin" hidden>
      <h1>Admin sign in</h1>
      <p class="sub">This console is for ChowBuy administrators only.</p>
      <form id="f" novalidate>
        <div class="f"><label for="em">Email</label><input id="em" name="email" type="email" autocomplete="username" inputmode="email" autocapitalize="off" spellcheck="false" required></div>
        <div class="f"><label for="pw">Password</label><input id="pw" name="password" type="password" autocomplete="current-password" required></div>
        <p class="err" id="err" role="alert"></p>
        <button type="submit" class="btn pri" id="go">Sign in</button>
      </form>
      <p class="foot">Not an admin? <a href="../" style="text-decoration:underline">Back to chowbuy.ng</a></p>
    </div>
  </div>
</div>
<div id="root" hidden></div>
<script src="gate.js?v=20261042"></script>
<script src="/assets/push-web.js?v=20261104" defer></script>
</body>
</html>
